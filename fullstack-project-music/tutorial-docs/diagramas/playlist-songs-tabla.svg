<title>La tabla playlist_songs: clave primaria compuesta y position</title>
<desc>Ejemplo de la playlist 7 con tres filas. La clave primaria es el par playlist_id y song_id. Añadir una canción nueva usa max(position) más uno; añadir una repetida se rechaza; quitar una canción deja un hueco que no se renumera.</desc>
