<text x="340" y="184" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ejemplo ilustrativo: playlist 7 con tres canciones</text>
<rect x="40" y="206" width="190" height="92" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="135.0" y="234.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">Añadir canción 40</text>
<text x="135.0" y="252.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">max(1, 2, 3) + 1 = 4</text>
<text x="135.0" y="270.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">se inserta (7, 40, 4)</text>
<rect x="245" y="206" width="190" height="92" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="340.0" y="225.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">Añadir canción 5</text>
<text x="340.0" y="243.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">la pareja (7, 5) ya está</text>
<text x="340.0" y="261.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">el servicio lanza 409</text>
<text x="340.0" y="279.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">la PK también lo evita</text>
<rect x="450" y="206" width="190" height="92" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="545.0" y="225.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Quitar canción 12</text>
<text x="545.0" y="243.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">quedan 2 y 3, hay hueco</text>
<text x="545.0" y="261.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">no se renumera</text>
<text x="545.0" y="279.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">siguiente: max + 1 = 4</text>
<rect x="40" y="328" width="12" height="12" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="58" y="334" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">se acepta</text>
<rect x="142.5" y="328" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="160.5" y="334" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">se rechaza</text>
