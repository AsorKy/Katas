<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>De dónde sale cada valor de configuración</title>
  <desc>La URL de la base viene del ENV del Dockerfile, la clave secreta viene del archivo .env a través de compose.yaml, y el algoritmo y la duración del token son valores por defecto de config.py. Settings los junta, y la app usa la URL para abrir SQLite en el volumen y la clave para firmar los JWT.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="371" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>

  <!-- fuentes -->
  <rect x="24" y="36" width="230" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="139" y="55" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Dockerfile · ENV</text>
  <text x="139" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">DATABASE_URL (no es secreto)</text>

  <rect x="24" y="124" width="230" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="139" y="143" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">.env → compose.yaml</text>
  <text x="139" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">SECRET_KEY vía ${SECRET_KEY:?}</text>

  <rect x="24" y="212" width="230" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="139" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">config.py</text>
  <text x="139" y="253" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">algoritmo y minutos por defecto</text>

  <!-- Settings -->
  <rect x="290" y="124" width="140" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="360" y="143" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Settings()</text>
  <text x="360" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">pydantic-settings</text>

  <!-- consumidores -->
  <rect x="470" y="36" width="186" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="563" y="55" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">engine SQLite</text>
  <text x="563" y="77" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">settings.database_url</text>

  <rect x="470" y="124" width="186" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="563" y="143" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">volumen backend-db</text>
  <text x="563" y="165" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">montado en /db</text>

  <rect x="470" y="212" width="186" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="563" y="231" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">firma de los JWT</text>
  <text x="563" y="253" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">settings.secret_key</text>

  <!-- flechas fuentes → Settings -->
  <path d="M 254 66 H 272 V 138 H 286" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 254 154 H 286" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 254 242 H 272 V 170 H 286" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- flechas Settings → consumidores -->
  <path d="M 430 146 H 450 V 66 H 466" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 430 162 H 450 V 242 H 466" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- el motor escribe en el volumen -->
  <path d="M 563 98 V 120" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="340" y="304" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">precedencia: variable de entorno > valor por defecto de config.py</text>

  <!-- leyenda -->
  <rect x="24" y="338" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="40" y="343" dominant-baseline="central" font-size="12" fill="#5F5E5A">secreto: fuera del repo y de la imagen</text>
  <rect x="300" y="338" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="316" y="343" dominant-baseline="central" font-size="12" fill="#5F5E5A">reglas de configuración</text>
  <rect x="470" y="338" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="486" y="343" dominant-baseline="central" font-size="12" fill="#5F5E5A">lo que usa la app</text>
</svg>
