<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 712" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Recorrido de POST /playlists/{id}/songs</title>
<desc>Una petición para añadir una canción pasa por cinco comprobaciones en orden: token (401), playlist propia (404), cuerpo (422), canción existente (404) y canción repetida (409). Si todas pasan, se inserta con position igual a max más uno y se responde 201 con el detalle.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="711" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="60" y="20" width="280" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="200.0" y="35.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">POST /playlists/7/songs</text>
<text x="200.0" y="53.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Bearer … · cuerpo {song_id: 12}</text>
