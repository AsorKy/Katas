<text x="535.0" y="273.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">422</text>
<text x="535.0" y="291.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">song_id ausente o no entero</text>
