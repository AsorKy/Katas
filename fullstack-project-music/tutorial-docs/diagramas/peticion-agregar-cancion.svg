<rect x="24" y="336" width="632" height="160" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="38" y="351" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">servicio</text>
<rect x="24" y="514" width="632" height="86" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="38" y="529" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">repositorio</text>
<rect x="60" y="110" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="200.0" y="125.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">bearer → current_user</text>
<text x="200.0" y="143.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">decodifica el JWT y carga el usuario</text>
<line x1="342" y1="134" x2="428" y2="134" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430" y="112" width="210" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="535.0" y="125.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">401</text>
<text x="535.0" y="143.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">sin token o token inválido</text>
<rect x="60" y="184" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="200.0" y="199.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">owned_playlist</text>
<text x="200.0" y="217.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">WHERE id = 7 AND owner_id = usuario</text>
