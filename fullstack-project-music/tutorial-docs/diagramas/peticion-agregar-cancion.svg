<text x="200.0" y="377.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">song_exists(song_id)</text>
<text x="200.0" y="395.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">services.add_song · paso 1</text>
<line x1="342" y1="386" x2="428" y2="386" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430" y="364" width="210" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="535.0" y="377.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">404</text>
<text x="535.0" y="395.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">SongNotFound: no existe</text>
<rect x="60" y="436" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="200.0" y="451.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">song_in_playlist(7, 12)</text>
<text x="200.0" y="469.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">services.add_song · paso 2</text>
<line x1="342" y1="460" x2="428" y2="460" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430" y="438" width="210" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="535.0" y="451.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">409</text>
<text x="535.0" y="469.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">AlreadyInPlaylist: ya está</text>
<line x1="200" y1="160" x2="200" y2="182" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="234" x2="200" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="412" x2="200" y2="434" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="308" x2="200" y2="360" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200" y1="486" x2="200" y2="538" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="540" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="200.0" y="555.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">repositories.add_song</text>
<text x="200.0" y="573.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">position = max + 1 · INSERT · commit</text>
<line x1="342" y1="564" x2="428" y2="564" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="430" y="536" width="210" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="535.0" y="546.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">red de seguridad</text>
<text x="535.0" y="564.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">PK (playlist_id, song_id)</text>
<text x="535.0" y="582.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">evita duplicados a la vez</text>
