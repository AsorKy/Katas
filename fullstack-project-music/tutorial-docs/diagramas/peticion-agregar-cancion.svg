<text x="535.0" y="199.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">404</text>
<text x="535.0" y="217.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">no existe o es de otro</text>
