<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 406" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Topología de la app con Docker Compose</title>
  <desc>El navegador pide la página al contenedor frontend en el puerto 5173 y después llama a la API del contenedor backend en el puerto 8000. El backend guarda la base SQLite en un volumen. No hay conexión del frontend al backend porque el JavaScript se ejecuta en el navegador.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="405" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>

  <!-- navegador -->
  <rect x="254" y="24" width="172" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="340" y="44" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">tu navegador</text>
  <text x="340" y="64" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">ejecuta el JS de React</text>

  <!-- contenedor compose -->
  <rect x="24" y="144" width="632" height="216" rx="12" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="40" y="162" dominant-baseline="central" font-size="12" fill="#5F5E5A">docker compose</text>

  <!-- frontend -->
  <rect x="48" y="182" width="270" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="183" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">frontend · nginx</text>
  <text x="183" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">sirve dist/ estático · puerto 80</text>

  <!-- backend -->
  <rect x="362" y="182" width="270" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="497" y="204" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">backend · uvicorn</text>
  <text x="497" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">FastAPI + SQLAlchemy · puerto 8000</text>

  <!-- volumen -->
  <rect x="362" y="282" width="270" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="497" y="302" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">volumen music-db</text>
  <text x="497" y="322" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">/db/music.db sobrevive al contenedor</text>

  <!-- aviso -->
  <rect x="48" y="282" width="270" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="183" y="302" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">sin flecha frontend → backend</text>
  <text x="183" y="322" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">el JS corre en tu navegador, no aquí</text>

  <!-- flechas -->
  <path d="M 300 82 V 104 H 183 V 178" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="116" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">1 · la página y el JS</text>
  <text x="175" y="130" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">localhost:5173 → 80</text>

  <path d="M 380 82 V 104 H 497 V 178" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="116" dominant-baseline="central" font-size="12" fill="#5F5E5A">2 · fetch de la API (JSON)</text>
  <text x="505" y="130" dominant-baseline="central" font-size="12" fill="#5F5E5A">localhost:8000 → 8000</text>

  <path d="M 497 248 V 278" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="507" y="263" dominant-baseline="central" font-size="12" fill="#5F5E5A">lee y escribe</text>

  <!-- leyenda -->
  <rect x="24" y="377" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="40" y="382" dominant-baseline="central" font-size="12" fill="#5F5E5A">frontend (React)</text>
  <rect x="170" y="377" width="10" height="10" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="186" y="382" dominant-baseline="central" font-size="12" fill="#5F5E5A">backend (FastAPI)</text>
  <rect x="330" y="377" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="346" y="382" dominant-baseline="central" font-size="12" fill="#5F5E5A">trampa típica</text>
</svg>
