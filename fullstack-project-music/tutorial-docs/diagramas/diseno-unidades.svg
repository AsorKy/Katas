<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>De bits a bytes: tasa frente a volumen</title><desc>Un oyente a 128 kbps consume 16 KB/s; una canción de 4 minutos pesa 3,84 MB; mil oyentes simultáneos necesitan 16 MB/s, es decir 128 Mbps. Multiplicar tamaño por usuarios da un volumen, no una tasa.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="371" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="20" y="30" width="180" height="74" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="110.0" y="48.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">velocidad de la canción</text>
<text x="110.0" y="67.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">128 kbps</text>
<text x="110.0" y="86.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">kilobits por segundo</text>
<rect x="250" y="30" width="180" height="74" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="340.0" y="48.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">lo que gasta un oyente</text>
<text x="340.0" y="67.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">16 KB/s</text>
<text x="340.0" y="86.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">kilobytes por segundo</text>
<rect x="480" y="30" width="180" height="74" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="570.0" y="48.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">la canción entera (4 min)</text>
<text x="570.0" y="67.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">3,84 MB</text>
<text x="570.0" y="86.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">megabytes: un volumen</text>
<path d="M 202 67 H 248" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="225" y="53" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">÷ 8</text>
<path d="M 432 67 H 478" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="455" y="53" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">× 240 s</text>
<rect x="20" y="172" width="180" height="84" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="110.0" y="185.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">regla de pantalla</text>
<text x="110.0" y="204.5" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1 byte = 8 bits</text>
<text x="110.0" y="223.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">kbps ÷ 8 = KB/s</text>
<text x="110.0" y="242.5" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Mbps ÷ 8 = MB/s</text>
<rect x="250" y="172" width="180" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="340.0" y="195.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">1.000 oyentes a la vez</text>
<text x="340.0" y="214.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">16 MB/s</text>
<text x="340.0" y="233.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">= 128 Mbps en la línea</text>
<rect x="480" y="172" width="180" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="570.0" y="185.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">tu cuenta de la Ronda 0</text>
<text x="570.0" y="204.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">3,84 MB × 1.000</text>
<text x="570.0" y="223.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">= 3,84 GB: un volumen</text>
<text x="570.0" y="242.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">no una tasa (por segundo)</text>
<path d="M 340 107 V 169" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="350" y="138" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">× 1.000 oyentes</text>
<rect x="20" y="278" width="640" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="340" y="294" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">streaming: 16 KB/s sostenidos durante 240 s, por oyente</text>
<text x="340" y="312" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">descarga: 3,84 MB de golpe, tan rápido como deje la línea</text>
<rect x="20" y="346" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="38" y="352" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">cálculo</text>
<rect x="104.1" y="346" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="122.1" y="352" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">regla</text>
<rect x="175.6" y="346" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="193.6" y="352" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">error de la Ronda 0</text>
</svg>
