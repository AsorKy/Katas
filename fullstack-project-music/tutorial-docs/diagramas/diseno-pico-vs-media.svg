<text x="78" y="175.91666666666666" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">media: 231 por s</text>
<text x="78" y="71.75" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">pico: 694 por s (3 veces la media)</text>
<text x="545.0" y="114.0" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">4 h con</text>
<text x="545.0" y="130.0" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">el 50 %</text>
<text x="545.0" y="146.0" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">de los plays</text>
<rect x="20" y="276" width="308" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="174.0" y="297.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">la media decide el costo</text>
<text x="174.0" y="316.5" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">20 M ÷ 86.400 s = 231 por s</text>
