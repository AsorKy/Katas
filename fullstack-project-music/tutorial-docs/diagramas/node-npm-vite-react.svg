<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 676" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" dominant-baseline="central" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Node, npm, Vite y React frente al mundo Python</title>
<desc>Tabla de equivalencias entre el mundo Python (python, uv, pyproject.toml, uv.lock, .venv, uvicorn, ruff) y el mundo JavaScript (Node.js, npm, package.json, package-lock.json, node_modules, Vite, ESLint, build). Debajo, la cadena real: tu código JSX, Vite sobre Node, el navegador con React y la API FastAPI. React es una biblioteca de interfaz: la pantalla es una función del estado.</desc>
<style>
.t{font-size:14px;font-weight:500;fill:#2C2C2A}
.s{font-size:12px;fill:#5F5E5A}
.eq{font-size:14px;font-weight:500;fill:#5F5E5A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.8}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}
.amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.8}.amber .t{fill:#633806}.amber .s{fill:#854F0B}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.8}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}
.coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.8}.coral .t{fill:#712B13}.coral .s{fill:#993C1D}
.purple rect{fill:#EEEDFE;stroke:#534AB7;stroke-width:.8}.purple .t{fill:#3C3489}.purple .s{fill:#534AB7}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="675" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>

<text class="t" x="140" y="24" text-anchor="middle">Mundo Python</text>
<text class="t" x="470" y="24" text-anchor="middle">Mundo JavaScript</text>

<g class="gray"><rect x="30" y="44" width="220" height="40" rx="8"/><text class="t" x="44" y="58">Python</text><text class="s" x="44" y="74">el lenguaje</text></g>
<text class="eq" x="270" y="64" text-anchor="middle">≈</text>
<g class="teal"><rect x="290" y="44" width="360" height="40" rx="8"/><text class="t" x="304" y="58">JavaScript</text><text class="s" x="304" y="74">el lenguaje; JSX es JS con etiquetas</text></g>

<g class="gray"><rect x="30" y="90" width="220" height="40" rx="8"/><text class="t" x="44" y="104">python</text><text class="s" x="44" y="120">intérprete</text></g>
<text class="eq" x="270" y="110" text-anchor="middle">≈</text>
<g class="teal"><rect x="290" y="90" width="360" height="40" rx="8"/><text class="t" x="304" y="104">Node.js</text><text class="s" x="304" y="120">ejecuta JS fuera del navegador (Vite, npm)</text></g>

<g class="gray"><rect x="30" y="136" width="220" height="40" rx="8"/><text class="t" x="44" y="150">uv · pip</text><text class="s" x="44" y="166">instalan paquetes</text></g>
<text class="eq" x="270" y="156" text-anchor="middle">≈</text>
<g class="teal"><rect x="290" y="136" width="360" height="40" rx="8"/><text class="t" x="304" y="150">npm</text><text class="s" x="304" y="166">instala paquetes (npm install)</text></g>

<g class="gray"><rect x="30" y="182" width="220" height="40" rx="8"/><text class="t" x="44" y="196">pyproject.toml</text><text class="s" x="44" y="212">dependencias declaradas</text></g>
<text class="eq" x="270" y="202" text-anchor="middle">≈</text>
<g class="teal"><rect x="290" y="182" width="360" height="40" rx="8"/><text class="t" x="304" y="196">package.json</text><text class="s" x="304" y="212">dependencias y scripts: dev, build, lint</text></g>

<g class="gray"><rect x="30" y="228" width="220" height="40" rx="8"/><text class="t" x="44" y="242">uv.lock</text><text class="s" x="44" y="258">versiones exactas</text></g>
<text class="eq" x="270" y="248" text-anchor="middle">≈</text>
<g class="teal"><rect x="290" y="228" width="360" height="40" rx="8"/><text class="t" x="304" y="242">package-lock.json</text><text class="s" x="304" y="258">versiones exactas</text></g>

<g class="gray"><rect x="30" y="274" width="220" height="40" rx="8"/><text class="t" x="44" y="288">.venv</text><text class="s" x="44" y="304">paquetes instalados</text></g>
<text class="eq" x="270" y="294" text-anchor="middle">≈</text>
<g class="teal"><rect x="290" y="274" width="360" height="40" rx="8"/><text class="t" x="304" y="288">node_modules</text><text class="s" x="304" y="304">paquetes instalados</text></g>

<g class="gray"><rect x="30" y="320" width="220" height="40" rx="8"/><text class="t" x="44" y="334">uvicorn --reload</text><text class="s" x="44" y="350">servidor de desarrollo</text></g>
<text class="eq" x="270" y="340" text-anchor="middle">≈</text>
<g class="teal"><rect x="290" y="320" width="360" height="40" rx="8"/><text class="t" x="304" y="334">npm run dev (Vite)</text><text class="s" x="304" y="350">servidor con recarga en caliente</text></g>

<g class="gray"><rect x="30" y="366" width="220" height="40" rx="8"/><text class="t" x="44" y="380">ruff check</text><text class="s" x="44" y="396">revisa el código</text></g>
<text class="eq" x="270" y="386" text-anchor="middle">≈</text>
<g class="teal"><rect x="290" y="366" width="360" height="40" rx="8"/><text class="t" x="304" y="380">npm run lint (ESLint)</text><text class="s" x="304" y="396">revisa el código</text></g>

<rect x="30" y="412" width="220" height="40" rx="8" fill="none" stroke="#B4B2A9" stroke-width=".8" stroke-dasharray="5 4"/>
<text class="t" x="44" y="426" fill="#5F5E5A" style="fill:#5F5E5A">—</text><text class="s" x="44" y="442">no hace falta empaquetar</text>
<g class="teal"><rect x="290" y="412" width="360" height="40" rx="8"/><text class="t" x="304" y="426">npm run build → dist/</text><text class="s" x="304" y="442">empaqueta HTML y JS para producción</text></g>

<text class="t" x="30" y="482">Lo que pasa cuando abres localhost:5173</text>

<g class="teal" text-anchor="middle"><rect x="30" y="500" width="140" height="56" rx="8"/><text class="t" x="100" y="518">Tu código</text><text class="s" x="100" y="538">src/*.jsx</text></g>
<g class="amber" text-anchor="middle"><rect x="190" y="500" width="140" height="56" rx="8"/><text class="t" x="260" y="518">Vite</text><text class="s" x="260" y="538">sobre Node.js</text></g>
<g class="teal" text-anchor="middle"><rect x="350" y="500" width="140" height="56" rx="8"/><text class="t" x="420" y="518">Navegador</text><text class="s" x="420" y="538">JS + React</text></g>
<g class="coral" text-anchor="middle"><rect x="510" y="500" width="140" height="56" rx="8"/><text class="t" x="580" y="518">API FastAPI</text><text class="s" x="580" y="538">localhost:8000</text></g>
<line class="arr" x1="172" y1="528" x2="188" y2="528" marker-end="url(#arrow)"/>
<line class="arr" x1="332" y1="528" x2="348" y2="528" marker-end="url(#arrow)"/>
<line class="arr" x1="492" y1="528" x2="508" y2="528" marker-end="url(#arrow)"/>

<g class="purple"><rect x="30" y="584" width="620" height="68" rx="8"/>
<text class="t" x="46" y="600">React: biblioteca de interfaz</text>
<text class="s" x="46" y="620">UI = f(estado): cambias el estado y React vuelve a dibujar lo que cambió.</text>
<text class="s" x="46" y="637">Vite y Node solo preparan y sirven el código; React corre en el navegador.</text></g>
</svg>
