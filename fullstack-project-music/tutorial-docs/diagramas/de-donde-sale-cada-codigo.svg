<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 624" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>De dónde sale cada código de estado en POST /songs</title>
<desc>La petición pasa por cuatro controles en orden: el token (401), la forma del cuerpo (422), la existencia de género y artistas en el servicio (404) y el guardado en el repositorio. Si todo va bien devuelve 201 con la canción. Cada fallo sale por la derecha con su código.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="623" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="40" y="24" width="320" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="200.0" y="37.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">POST /songs</text>
<text x="200.0" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Authorization: Bearer + cuerpo JSON</text>
<line x1="200.0" y1="74" x2="200.0" y2="102" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="104" width="320" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="200.0" y="115.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Router · current_user</text>
<text x="200.0" y="137.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">dependencies=[Depends(current_user)]</text>
<text x="200.0" y="156.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">¿hay token y es válido?</text>
<rect x="420" y="104" width="220" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="530.0" y="115.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">401</text>
<text x="530.0" y="137.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">falta o falla el token</text>
<text x="530.0" y="156.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">lo lanza current_user</text>
<line x1="362" y1="136" x2="418" y2="136" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390.0" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">falla</text>
<line x1="200.0" y1="170" x2="200.0" y2="198" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="200" width="320" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="200.0" y="211.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Router · Pydantic SongCreate</text>
<text x="200.0" y="233.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">¿forma válida?</text>
<text x="200.0" y="252.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">título, duration_s &gt; 0, artistas únicos</text>
<rect x="420" y="200" width="220" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="530.0" y="211.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">422</text>
<text x="530.0" y="233.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">cuerpo con forma inválida</text>
<text x="530.0" y="252.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">lo lanza FastAPI antes del código</text>
<line x1="362" y1="232" x2="418" y2="232" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">falla</text>
<line x1="200.0" y1="266" x2="200.0" y2="294" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="296" width="320" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="200.0" y="307.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Servicio · create_song</text>
<text x="200.0" y="329.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">genre_exists, existing_artist_ids</text>
<text x="200.0" y="348.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">¿existen el género y los artistas?</text>
<rect x="420" y="296" width="220" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="530.0" y="307.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">404</text>
<text x="530.0" y="329.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">RelatedNotFound (servicio)</text>
<text x="530.0" y="348.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">el router lo traduce a 404</text>
<line x1="362" y1="328" x2="418" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390.0" y="314" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">falla</text>
<line x1="200.0" y1="362" x2="200.0" y2="390" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="392" width="320" height="64" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="200.0" y="403.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Repositorio · create_song</text>
<text x="200.0" y="425.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">flush, add_all y commit</text>
<text x="200.0" y="444.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">todo o nada en una transacción</text>
<rect x="420" y="392" width="220" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="530.0" y="403.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">500</text>
<text x="530.0" y="425.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">error inesperado: IntegrityError</text>
<text x="530.0" y="444.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">nadie lo captura (bug nuestro)</text>
<line x1="362" y1="424" x2="418" y2="424" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390.0" y="410" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">falla</text>
<line x1="200.0" y1="458" x2="200.0" y2="488" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="490" width="320" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="200.0" y="507.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">201 + SongsOut</text>
<text x="200.0" y="529.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">response_model filtra y serializa</text>
<text x="40" y="578" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Las dependencias se resuelven antes que el cuerpo: con token ausente y cuerpo inválido sale 401, no 422.</text>
<text x="40" y="598" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">El 404 solo llega si el cuerpo ya es válido: primero la forma, después la existencia en la base.</text>
</svg>
