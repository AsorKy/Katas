<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 512" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>El problema N+1 frente al lote con IN</title>
<desc>A la izquierda, una consulta para la lista y después una consulta por cada canción para su género y sus artistas: 25 consultas medidas con 20 canciones. A la derecha, la misma lista y solo dos consultas con IN, una para los géneros y otra para los artistas: 2 consultas.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="511" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="40" y="30" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Una consulta por canción</text>
<text x="40" y="50" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#854F0B">el problema N+1</text>
<text x="360" y="30" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">Un lote por página</text>
<text x="360" y="50" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3B6D11">el patrón con IN</text>
<rect x="40" y="72" width="280" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="180.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">1 consulta: la lista</text>
<text x="180.0" y="107.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">SELECT … LIMIT 20</text>
<line x1="180.0" y1="122" x2="180.0" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="140" width="280" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="180.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">canción 1</text>
<text x="180.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">su género y sus artistas</text>
<rect x="40" y="200" width="280" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="180.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">canción 2</text>
<text x="180.0" y="235.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">su género y sus artistas</text>
<text x="180.0" y="268" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="400" fill="#5F5E5A">⋮</text>
<rect x="40" y="288" width="280" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="180.0" y="301.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">canción 20</text>
<text x="180.0" y="323.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">su género y sus artistas</text>
<line x1="180.0" y1="338" x2="180.0" y2="374" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="376" width="280" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="180.0" y="387.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">25 consultas</text>
<text x="180.0" y="409.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">medido con 20 canciones,</text>
<text x="180.0" y="428.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">sin contar la de la lista</text>
<rect x="360" y="72" width="280" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="500.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">1 consulta: la lista</text>
<text x="500.0" y="107.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">SELECT … LIMIT 20</text>
<line x1="500.0" y1="122" x2="500.0" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360" y="140" width="280" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="500.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">géneros de la página</text>
<text x="500.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">WHERE genre.id IN (…)</text>
<line x1="500.0" y1="190" x2="500.0" y2="206" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360" y="208" width="280" height="48" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="500.0" y="221.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">artistas de la página</text>
<text x="500.0" y="243.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">WHERE song_id IN (…)</text>
<line x1="500.0" y1="258" x2="500.0" y2="274" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360" y="276" width="280" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="500.0" y="289.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">en Python</text>
<text x="500.0" y="311.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">agrupa por song_id (defaultdict)</text>
<line x1="500.0" y1="326" x2="500.0" y2="374" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360" y="376" width="280" height="64" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="500.0" y="387.5" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#27500A">2 consultas</text>
<text x="500.0" y="409.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">medido con 20 canciones,</text>
<text x="500.0" y="428.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">sin contar la de la lista</text>
<text x="40" y="468" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">A la izquierda el número de consultas crece con N (las canciones de la página).</text>
<text x="40" y="488" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">A la derecha no depende de N: siempre una por tabla relacionada.</text>
</svg>
