<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Mapa de decisiones: fallos, abuso y confianza</title><desc>Escalera de seis preguntas sobre terceros lentos, peticiones repetidas, picos y abuso, varios clientes, observabilidad y objetivos de servicio. Cada respuesta afirmativa lleva a la pieza de resiliencia o seguridad correspondiente.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="629" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="20" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">mapa 3 · ¿qué puede salir mal? cada «sí» añade una protección</text>
<rect x="20" y="44" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="63.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿un tercero puede fallar?</text>
<text x="135.0" y="83.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">o ir lento, que es peor que caído</text>
<rect x="290" y="44" width="370" height="58" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="475.0" y="55.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">timeout y reintento acotado</text>
<text x="475.0" y="73.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">backoff con jitter, solo errores transitorios</text>
<text x="475.0" y="90.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">circuit breaker y degradación visible</text>
<path d="M 252 73.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="62.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 105 V 123" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="114.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="126" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="145.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿petición repetible?</text>
<text x="135.0" y="165.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">cobros, creaciones, reintentos</text>
<rect x="290" y="126" width="370" height="58" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="475.0" y="137.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">idempotencia</text>
<text x="475.0" y="155.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Idempotency-Key única; se guarda la 1.ª respuesta</text>
<text x="475.0" y="172.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">otro body con la misma clave: 422</text>
<path d="M 252 155.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="144.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 187 V 205" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="196.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="208" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="227.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿picos o abuso?</text>
<text x="135.0" y="247.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">un cliente con un bug</text>
<rect x="290" y="208" width="370" height="58" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="475.0" y="219.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">rate limit (token bucket)</text>
<text x="475.0" y="237.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">429 con Retry-After, por cliente</text>
<text x="475.0" y="254.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">rechazo temprano antes que encolar sin fin</text>
<path d="M 252 237.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="226.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 269 V 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="278.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="290" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="309.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿varios clientes?</text>
<text x="135.0" y="329.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">los datos de unos no son de otros</text>
<rect x="290" y="290" width="370" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="475.0" y="301.5" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">el tenant sale del token</text>
<text x="475.0" y="319.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">filtro de tenant en un solo lugar</text>
<text x="475.0" y="336.5" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">también en eventos, caché y rate limit</text>
<path d="M 252 319.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="308.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 351 V 369" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="360.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="372" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="391.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿muchas copias?</text>
<text x="135.0" y="411.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">«falló a las 10:42»</text>
<rect x="290" y="372" width="370" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="475.0" y="383.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">observabilidad</text>
<text x="475.0" y="401.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">logs JSON con request_id; métricas RED y USE</text>
<text x="475.0" y="418.5" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">medidas por versión desplegada</text>
<path d="M 252 401.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="390.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 433 V 451" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="442.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="454" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="473.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿«que nunca falle»?</text>
<text x="135.0" y="493.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">no existe: se mide y se acota</text>
<rect x="290" y="454" width="370" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="475.0" y="465.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">SLO y presupuesto de error</text>
<text x="475.0" y="483.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">SLI medido contra el SLO; alerta por consumo</text>
<text x="475.0" y="500.5" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">presupuesto agotado: se congelan los cambios</text>
<path d="M 252 483.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="472.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 515 V 535" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="525.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="538" width="330" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="185" y="557" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">fin: lo que no marcaste, no lo pongas</text>
<rect x="20" y="596" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="38" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">fallos y carga</text>
<rect x="148.2" y="596" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="166.2" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">seguridad</text>
<rect x="244.89999999999998" y="596" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="262.9" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">medir y comprometerse</text>
</svg>
