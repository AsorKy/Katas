<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cómo se relacionan pyproject.toml, uv.lock, .python-version y .venv con los comandos de uv</title>
<desc>pyproject.toml declara las dependencias y uv.lock fija las versiones exactas; uv add las escribe, uv sync instala en .venv lo que dice el lock, .python-version indica el Python, y uv run ejecuta pytest o uvicorn dentro del .venv.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.bt{fill:#0C447C}.bs{fill:#185FA5}
.gt{fill:#444441}.gs{fill:#5F5E5A}
.tt{fill:#085041}.tsub{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="529" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>

<rect x="40" y="30" width="210" height="104" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th bt" x="145" y="48" text-anchor="middle" dominant-baseline="central">pyproject.toml</text>
<text class="ts bs" x="145" y="68" text-anchor="middle" dominant-baseline="central">lo que pides</text>
<text class="ts bs" x="145" y="85" text-anchor="middle" dominant-baseline="central">fastapi, sqlalchemy, …</text>
<text class="ts bs" x="145" y="102" text-anchor="middle" dominant-baseline="central">dev: pytest, httpx2, ruff</text>
<text class="ts bs" x="145" y="119" text-anchor="middle" dominant-baseline="central">requires-python &gt;=3.12</text>

<rect x="274" y="30" width="150" height="104" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th bt" x="349" y="48" text-anchor="middle" dominant-baseline="central">.python-version</text>
<text class="ts bs" x="349" y="76" text-anchor="middle" dominant-baseline="central">Python fijado</text>
<text class="ts bs" x="349" y="96" text-anchor="middle" dominant-baseline="central">contiene: 3.12</text>

<line x1="145" y1="136" x2="145" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="157" y="163" dominant-baseline="central">uv add [--dev] · uv lock</text>

<rect x="40" y="192" width="210" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th bt" x="145" y="210" text-anchor="middle" dominant-baseline="central">uv.lock</text>
<text class="ts bs" x="145" y="229" text-anchor="middle" dominant-baseline="central">versiones exactas + hashes</text>

<line x1="145" y1="246" x2="145" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="157" y="273" dominant-baseline="central">uv sync</text>

<line x1="349" y1="136" x2="349" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="361" y="246" dominant-baseline="central">fija Python</text>

<rect x="40" y="302" width="384" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="th gt" x="232" y="322" text-anchor="middle" dominant-baseline="central">.venv/ · lo instalado</text>
<text class="ts gs" x="232" y="342" text-anchor="middle" dominant-baseline="central">fastapi, pytest, ruff… con Python 3.12</text>

<line x1="135" y1="364" x2="135" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="147" y="392" dominant-baseline="central">se ejecutan dentro</text>
<line x1="340" y1="364" x2="340" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="422" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th tt" x="135" y="440" text-anchor="middle" dominant-baseline="central">uv run pytest -q</text>
<text class="ts tsub" x="135" y="460" text-anchor="middle" dominant-baseline="central">ejecuta los tests</text>
<rect x="254" y="422" width="386" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th tt" x="447" y="440" text-anchor="middle" dominant-baseline="central">uv run uvicorn app.main:app --reload</text>
<text class="ts tsub" x="447" y="460" text-anchor="middle" dominant-baseline="central">levanta la API en localhost:8000</text>

<text class="ts" x="546" y="40" text-anchor="middle" dominant-baseline="central">si vienes de pip</text>
<rect x="452" y="56" width="188" height="52" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="th" x="546" y="73" text-anchor="middle" dominant-baseline="central">pyproject.toml</text>
<text class="ts" x="546" y="92" text-anchor="middle" dominant-baseline="central">≈ requirements.in</text>
<rect x="452" y="192" width="188" height="52" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="th" x="546" y="209" text-anchor="middle" dominant-baseline="central">uv.lock</text>
<text class="ts" x="546" y="228" text-anchor="middle" dominant-baseline="central">≈ requirements.txt fijado</text>
<rect x="452" y="306" width="188" height="52" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="th" x="546" y="323" text-anchor="middle" dominant-baseline="central">.venv</text>
<text class="ts" x="546" y="342" text-anchor="middle" dominant-baseline="central">≈ venv + pip install</text>

<rect x="40" y="496" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="ts" x="58" y="502" dominant-baseline="central">va a git</text>
<rect x="150" y="496" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="3 2"/>
<text class="ts" x="168" y="502" dominant-baseline="central">no va a git (.gitignore)</text>
<rect x="342" y="496" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="ts" x="360" y="502" dominant-baseline="central">comando que ejecutas</text>
</svg>
