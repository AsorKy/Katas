<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cadena de estimación de tráfico</title><desc>De usuarios activos a ancho de banda de pico: 1 millón de usuarios, 20 millones de reproducciones por día, 231 por segundo de media, 694 de pico, 166.667 reproducciones a la vez y 21,3 Gbps.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="329" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="20" y="24" width="190" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="115.0" y="45.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">usuarios activos por día</text>
<text x="115.0" y="64.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1 M</text>
<text x="115.0" y="83.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">supuesto de partida</text>
<rect x="245" y="24" width="190" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340.0" y="45.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">reproducciones por día</text>
<text x="340.0" y="64.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">20 M</text>
<text x="340.0" y="83.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">1 M × 20 por usuario</text>
<rect x="470" y="24" width="190" height="80" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="565.0" y="45.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">tasa media</text>
<text x="565.0" y="64.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">231 por s</text>
<text x="565.0" y="83.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">20 M ÷ 86.400 s</text>
<rect x="20" y="164" width="190" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="115.0" y="185.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">tasa de pico</text>
<text x="115.0" y="204.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">694 por s</text>
<text x="115.0" y="223.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">231 × 3 (factor de pico)</text>
<rect x="245" y="164" width="190" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="340.0" y="185.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">reproducciones a la vez</text>
<text x="340.0" y="204.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">166.667</text>
<text x="340.0" y="223.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">694 × 240 s (Little)</text>
<rect x="470" y="164" width="190" height="80" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="565.0" y="185.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">ancho de banda de pico</text>
<text x="565.0" y="204.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">21,3 Gbps</text>
<text x="565.0" y="223.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">166.667 × 128 kbps</text>
<path d="M 212 64 H 243" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 437 64 H 468" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 565 107 V 135 H 115 V 161" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 212 204 H 243" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 437 204 H 468" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="266" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="38" y="272" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">supuesto</text>
<rect x="110.4" y="266" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="128.4" y="272" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">media: decide el costo</text>
<rect x="289.0" y="266" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="307.0" y="272" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">pico: decide la capacidad</text>
<text x="20" y="298" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">ley de Little: gente a la vez = llegadas por segundo × duración de cada una</text>
</svg>
