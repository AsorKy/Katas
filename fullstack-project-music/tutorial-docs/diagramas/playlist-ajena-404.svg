<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 544" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Por qué una playlist ajena responde 404 y no 403</title>
<desc>El usuario B pide la playlist 7, que existe pero es del usuario A, y la playlist 999, que no existe. owned_playlist consulta por id y dueño a la vez, así que en ambos casos obtiene cero filas y el servidor responde el mismo 404; con 403 se revelaría qué ids existen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="543" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="170" y="20" width="340" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340.0" y="37.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">tabla playlists</text>
<text x="340.0" y="55.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">id 7 es de A · no existe el id 999</text>
<rect x="40" y="100" width="280" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="180.0" y="115.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">B pide GET /playlists/7</text>
<text x="180.0" y="133.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">usuario B, token válido</text>
<rect x="360" y="100" width="280" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="500.0" y="115.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">B pide GET /playlists/999</text>
<text x="500.0" y="133.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">usuario B, token válido</text>
<line x1="180" y1="150" x2="180" y2="176" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="150" x2="500" y2="176" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="178" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="180.0" y="193.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">owned_playlist</text>
<text x="180.0" y="211.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">WHERE id = 7 AND owner_id = B</text>
<rect x="360" y="178" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="500.0" y="193.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">owned_playlist</text>
<text x="500.0" y="211.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">WHERE id = 999 AND owner_id = B</text>
<line x1="180" y1="228" x2="180" y2="254" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="228" x2="500" y2="254" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="256" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="180.0" y="271.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">0 filas → None</text>
<text x="180.0" y="289.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">el 7 existe, pero es de A</text>
<rect x="360" y="256" width="280" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="500.0" y="271.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">0 filas → None</text>
<text x="500.0" y="289.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">el 999 no existe</text>
<line x1="180" y1="306" x2="180" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500" y1="306" x2="500" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="100" y="352" width="480" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="340.0" y="370.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">404 Not Found</text>
<text x="340.0" y="388.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">mismo código y mismo formato de error; no revela si el id existe</text>
<rect x="100" y="436" width="480" height="54" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="340.0" y="454.0" font-size="14" font-weight="500" fill="#791F1F" text-anchor="middle" dominant-baseline="central">Con 403 el atacante sacaría información</text>
<text x="340.0" y="472.0" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">403 en el 7 y 404 en el 999 delatan qué ids existen</text>
<rect x="40" y="514" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="58" y="520" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">petición</text>
<rect x="136.0" y="514" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="154.0" y="520" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">código del servidor</text>
<rect x="303.5" y="514" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="321.5" y="520" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">respuesta</text>
<rect x="406.0" y="514" width="12" height="12" rx="3" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8" stroke-dasharray="3 2"/>
<text x="424.0" y="520" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">lo que evitamos</text>
</svg>
