<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Mapa de decisiones: del número a la decisión</title><desc>Escalera de seis preguntas sobre los números del paso 1: ancho de banda, pico, SLO, lentitud, almacenamiento y p99. Cada respuesta afirmativa lleva a una decisión de diseño; si ninguna aplica, no se pone la pieza.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="629" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="20" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">mapa 1 · ¿qué número tengo? responde de arriba abajo: cada «sí» añade una decisión</text>
<rect x="20" y="44" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="63.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿el pico llega a Gbps?</text>
<text x="135.0" y="83.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ancho de banda = oyentes × bitrate</text>
<rect x="290" y="44" width="370" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="475.0" y="55.5" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">CDN y URL firmada</text>
<text x="475.0" y="73.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">los bytes no pasan por la API (plano de datos)</text>
<text x="475.0" y="90.5" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">palanca de costo: bitrate y tasa de aciertos</text>
<path d="M 252 73.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="62.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 105 V 123" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="114.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="126" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="145.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿el pico supera la media?</text>
<text x="135.0" y="165.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">factor de pico de 2 o más</text>
<rect x="290" y="126" width="370" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="475.0" y="137.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">dimensiona con el pico</text>
<text x="475.0" y="155.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">mínimo 2 copias; autoescalado si el tráfico varía</text>
<text x="475.0" y="172.5" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">prueba de carga a 5 veces el pico</text>
<path d="M 252 155.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="144.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 187 V 205" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="196.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="208" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="227.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿SLO de 99,9 % o más?</text>
<text x="135.0" y="247.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">43,2 min de caída al mes</text>
<rect x="290" y="208" width="370" height="58" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="475.0" y="219.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">redundancia y reversa automática</text>
<text x="475.0" y="237.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">99,9 %: 2 copias en el camino y monitor externo</text>
<text x="475.0" y="254.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">99,99 %: más de una zona; en serie se multiplica</text>
<path d="M 252 237.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="226.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 269 V 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="278.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="290" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="309.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿algo puede ir lento?</text>
<text x="135.0" y="329.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">más espera = más en vuelo</text>
<rect x="290" y="290" width="370" height="58" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="475.0" y="301.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">timeouts, rechazo temprano y breaker</text>
<text x="475.0" y="319.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">pool con límite; 503 antes que encolar sin fin</text>
<text x="475.0" y="336.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">degradar con datos viejos, marcados como tales</text>
<path d="M 252 319.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="308.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 351 V 369" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="360.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="372" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="391.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿cientos de TB guardados?</text>
<text x="135.0" y="411.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">catálogo, originales y versiones</text>
<rect x="290" y="372" width="370" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="475.0" y="383.5" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">almacenamiento de objetos</text>
<text x="475.0" y="401.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">nunca BLOB en la base; conserva el original</text>
<text x="475.0" y="418.5" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">regla de ciclo de vida para lo viejo o incompleto</text>
<path d="M 252 401.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="390.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 433 V 451" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="442.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="454" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="473.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿p99 exigente?</text>
<text x="135.0" y="493.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">la cola se amplifica por pantalla</text>
<rect x="290" y="454" width="370" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="475.0" y="465.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">ataca la cola, no la media</text>
<text x="475.0" y="483.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">cachea lo caro y repetido; timeouts por ruta</text>
<text x="475.0" y="500.5" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">menos llamadas por pantalla</text>
<path d="M 252 483.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="472.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 515 V 535" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="525.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="538" width="330" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="185" y="557" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">fin: lo que no marcaste, no lo pongas</text>
<rect x="20" y="596" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="38" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">bytes y almacenamiento</text>
<rect x="198.6" y="596" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="216.6" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">capacidad y latencia</text>
<rect x="364.6" y="596" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="382.6" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">disponibilidad y fallos</text>
</svg>
