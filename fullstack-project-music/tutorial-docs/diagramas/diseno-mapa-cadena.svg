<text x="118.0" y="209.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">todos reintentan</text>
<text x="118.0" y="228.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">a la vez</text>
<text x="118.0" y="247.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">backoff con jitter</text>
