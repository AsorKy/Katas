<text x="191.39999999999998" y="438" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">fallos</text>
<rect x="251.2" y="432" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="269.2" y="438" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">observar y comprometerse</text>
<text x="20" y="464" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">cada flecha: el eslabón anterior choca con un problema nuevo</text>
