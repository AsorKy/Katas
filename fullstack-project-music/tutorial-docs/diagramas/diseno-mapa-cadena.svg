<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>La cadena de eslabones del backend</title><desc>Nueve eslabones: procesos sin estado llevan a un token firmado; copias desechables a timeouts y reintentos; reintentar a idempotencia; reintentos simultáneos a backoff con jitter; un tercero lento a circuit breaker; trabajo largo a cola y workers; guardar y encolar a outbox; muchas copias a observabilidad; y que nunca falle no existe, a SLO y presupuesto de error.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="489" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="20" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">mapa 4 · en cada caja: el problema (arriba) y la pieza que lo resuelve (en negrita)</text>
