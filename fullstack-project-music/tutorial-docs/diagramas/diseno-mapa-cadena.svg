<text x="340.0" y="88.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">timeouts y</text>
<text x="340.0" y="107.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">reintentos</text>
