<text x="562.0" y="358.5" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">no existe</text>
<text x="562.0" y="377.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">SLO y presupuesto</text>
<text x="562.0" y="396.5" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">de error</text>
