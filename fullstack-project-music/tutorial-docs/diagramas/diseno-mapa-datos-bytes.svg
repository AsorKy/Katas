<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Mapa de decisiones: datos, bytes y trabajo</title><desc>Escalera de seis preguntas sobre archivos grandes, trabajo largo, lectura masiva, contadores calientes, relaciones y eventos. Cada respuesta afirmativa lleva a la pieza que lo resuelve.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="629" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="20" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">mapa 2 · ¿qué mueve o guarda mi sistema? cada «sí» añade una pieza</text>
<rect x="20" y="44" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="63.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿archivos grandes?</text>
<text x="135.0" y="83.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">subidas de audio</text>
<rect x="290" y="44" width="370" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="475.0" y="55.5" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">subida directa al almacenamiento</text>
<text x="475.0" y="73.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">URL prefirmada, multiparte y reanudable</text>
<text x="475.0" y="90.5" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">estados y limpieza de subidas incompletas</text>
<path d="M 252 73.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="62.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 105 V 123" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="114.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="126" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="145.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿trabajo largo?</text>
<text x="135.0" y="165.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">transcodificar, informes</text>
<rect x="290" y="126" width="370" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="475.0" y="137.5" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">cola, workers y respuesta 202</text>
<text x="475.0" y="155.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">estado visible; la cola lleva la referencia</text>
<text x="475.0" y="172.5" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">reintentos idempotentes y cola de mensajes muertos</text>
<path d="M 252 155.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="144.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 187 V 205" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="196.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="208" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="227.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿mucha lectura repetida?</text>
<text x="135.0" y="247.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">contenido popular o viral</text>
<rect x="290" y="208" width="370" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="475.0" y="219.5" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">CDN y caché con TTL</text>
<text x="475.0" y="237.0" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">el borde sirve; el origen solo atiende los fallos</text>
<text x="475.0" y="254.5" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">TTL con jitter; claves versionadas</text>
<path d="M 252 237.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="226.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 269 V 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="278.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="290" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="309.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿contador o fila caliente?</text>
<text x="135.0" y="329.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">muchas escrituras a una fila</text>
<rect x="290" y="290" width="370" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="475.0" y="301.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">saca la escritura de la fila</text>
<text x="475.0" y="319.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">eventos que solo se añaden, o INCR y volcado</text>
<text x="475.0" y="336.5" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">consistencia eventual: unos segundos de atraso</text>
<path d="M 252 319.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="308.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 351 V 369" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="360.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="372" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="391.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿relaciones N:M?</text>
<text x="135.0" y="411.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">catálogo, playlists, favoritos</text>
<rect x="290" y="372" width="370" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="475.0" y="383.5" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">SQL con índices</text>
<text x="475.0" y="401.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">si hace falta: caché y réplicas de lectura</text>
<text x="475.0" y="418.5" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">NoSQL solo por un patrón de acceso concreto</text>
<path d="M 252 401.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="390.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 433 V 451" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="442.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="454" width="230" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="135.0" y="473.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">¿guardar y avisar?</text>
<text x="135.0" y="493.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">dos escrituras en dos sitios</text>
<rect x="290" y="454" width="370" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="475.0" y="465.5" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">outbox</text>
<text x="475.0" y="483.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">el evento va en la misma transacción que el dato</text>
<text x="475.0" y="500.5" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">el consumidor es idempotente (inbox)</text>
<path d="M 252 483.0 H 287" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="270.0" y="472.0" font-size="12" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">sí</text>
<path d="M 135.0 515 V 535" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145.0" y="525.0" font-size="12" font-weight="500" fill="#444441" text-anchor="start" dominant-baseline="central">sigue</text>
<rect x="20" y="538" width="330" height="38" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="185" y="557" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">fin: lo que no marcaste, no lo pongas</text>
<rect x="20" y="596" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="38" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">bytes</text>
<rect x="91.5" y="596" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="109.5" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">trabajo asíncrono y eventos</text>
<rect x="301.6" y="596" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="319.6" y="602" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">datos</text>
</svg>
