<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 388" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Nueves de disponibilidad y minutos de caída al mes</title><desc>Con 30 días, 99 por ciento permite 7 horas 12 minutos de caída, 99,9 por ciento 43,2 minutos, 99,99 por ciento 4,32 minutos y 99,999 por ciento 26 segundos. En serie las disponibilidades se multiplican.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="387" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="20" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">SLO mensual</text>
<text x="110" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">minutos de caída permitidos (escala logarítmica)</text>
<text x="470" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">qué exige</text>
<text x="20" y="60" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">99 %</text>
<rect x="110" y="48" width="254.48386227704384" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="372.48386227704384" y="60" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start" dominant-baseline="central">7 h 12 min</text>
<text x="470" y="60" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">una copia y reversa manual</text>
<text x="20" y="102" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">99,9 %</text>
<rect x="110" y="90" width="184.48386227704384" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="302.48386227704384" y="102" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start" dominant-baseline="central">43,2 min</text>
<text x="470" y="102" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">2 copias y reversa automática</text>
<text x="20" y="144" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">99,99 %</text>
<rect x="110" y="132" width="114.48386227704385" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="232.48386227704384" y="144" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start" dominant-baseline="central">4,32 min</text>
<text x="470" y="144" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">más de una zona</text>
<text x="20" y="186" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">99,999 %</text>
<rect x="110" y="174" width="44.48386227704385" height="24" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="162.48386227704384" y="186" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start" dominant-baseline="central">26 s</text>
<text x="470" y="186" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">—</text>
<text x="110" y="224" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">cada nueve más divide la caída permitida entre 10</text>
<rect x="20" y="252" width="308" height="78" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="174.0" y="272.0" font-size="12" font-weight="400" fill="#0C447C" text-anchor="middle" dominant-baseline="central">minutos caídos = 43.200 × (1 − SLO)</text>
<text x="174.0" y="291.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">99,99 %: 259,2 s ÷ 60 = 4,32 min</text>
<text x="174.0" y="310.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">(30 días = 2.592.000 s = 43.200 min)</text>
<rect x="352" y="252" width="308" height="78" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="506.0" y="272.0" font-size="12" font-weight="400" fill="#633806" text-anchor="middle" dominant-baseline="central">en serie, las disponibilidades se multiplican</text>
<text x="506.0" y="291.0" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">99,9 % × 99,9 % = 99,8 %</text>
<text x="506.0" y="310.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">86 min al mes: el doble de lo permitido</text>
<rect x="20" y="354" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="38" y="360" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">cuenta</text>
<rect x="97.8" y="354" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="115.8" y="360" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">trampa</text>
</svg>
