<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 608" width="680" height="608" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Input controlado y búsqueda con useEffect y [q]</title>
<desc>Al pulsar una tecla, onChange llama a setQ, React vuelve a ejecutar SongList y el input muestra q. Como q cambió, el efecto con [q] cancela la petición anterior y pide GET /songs?q=texto; setSongs provoca otro render con la lista filtrada, en el que q no cambia y el ciclo termina.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="607" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="64" y="44" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="224.0" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Pulsas una tecla</text>
<text x="224.0" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">el campo dispara el evento onChange</text>
<rect x="64" y="136" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="224.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">onChange(e) → setQ(e.target.value)</text>
<text x="224.0" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">tu función guarda el texto en el estado q</text>
<rect x="64" y="228" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="224.0" y="246" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">React vuelve a ejecutar SongList</text>
<text x="224.0" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">esta vez q vale el texto nuevo</text>
<rect x="64" y="320" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="224.0" y="338" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">El efecto con [q] se repite</text>
<text x="224.0" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">cleanup: abort() de la petición anterior</text>
<rect x="64" y="412" width="320" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="224.0" y="430" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">GET /songs?q=texto</text>
<text x="224.0" y="450" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">el backend filtra por título</text>
<rect x="64" y="504" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="224.0" y="522" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">setSongs(lista) → nuevo render</text>
<text x="224.0" y="542" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">la lista filtrada aparece en pantalla</text>
<line x1="224" y1="102" x2="224" y2="134" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="224" y1="194" x2="224" y2="226" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="224" y1="286" x2="224" y2="318" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="224" y1="378" x2="224" y2="410" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="224" y1="470" x2="224" y2="502" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="430" y="228" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="535.0" y="246" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">&lt;input value={q}&gt;</text>
<text x="535.0" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">el campo muestra q</text>
<line x1="386" y1="256" x2="428" y2="256" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M64 532 H46 V256 H62" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="430" y="320" width="210" height="112" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="535" y="338" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Contraste</text>
<text x="535" y="362" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">Sin onChange, el campo se</text>
<text x="535" y="380" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">queda congelado: value={q}</text>
<text x="535" y="398" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">lo obliga a mostrar q, y q</text>
<text x="535" y="416" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">nunca cambiaría.</text>
<rect x="430" y="452" width="210" height="88" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="535" y="470" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Fin del ciclo</text>
<text x="535" y="494" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">En el segundo render q</text>
<text x="535" y="512" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">no cambió: el efecto no se</text>
<text x="535" y="530" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">repite y el ciclo termina.</text>
<rect x="40" y="577" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="62" y="584" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">React (navegador)</text>
<rect x="202" y="577" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="224" y="584" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">backend (FastAPI)</text>
<rect x="364" y="577" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="386" y="584" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">usuario y notas</text>
</svg>
