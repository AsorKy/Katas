<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 264" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Anatomía de un JWT</title>
<desc>Un JWT son tres partes unidas por puntos: cabecera con el algoritmo HS256, carga con sub y exp, y firma HMAC calculada con secret_key.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="263" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="40" y="24" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">access_token = cabecera.carga.firma</text>
<rect x="40" y="44" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="130.0" y="62.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">cabecera</text>
<text x="130.0" y="82.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">{"alg": "HS256"}</text>
<rect x="250" y="44" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="340.0" y="62.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">carga (payload)</text>
<text x="340.0" y="82.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">{"sub": "1", "exp": …}</text>
<rect x="460" y="44" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="550.0" y="62.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">firma</text>
<text x="550.0" y="82.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">HMAC(secret_key)</text>
<text x="235" y="72" font-size="20" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">.</text>
<text x="445" y="72" font-size="20" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">.</text>
<text x="40" y="128" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">create_access_token(user_id):</text>
<text x="40" y="150" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">payload = {"sub": str(user_id), "exp": ahora_UTC + 60 min}</text>
<text x="40" y="172" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">jwt.encode(payload, settings.secret_key, algorithm="HS256")</text>
<text x="40" y="204" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">La carga solo está codificada (base64url): cualquiera puede leerla, no guardes secretos ahí.</text>
<text x="40" y="224" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">La firma impide cambiarla: sin la secret_key no se puede falsificar un token válido.</text>
<text x="40" y="244" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">decode_access_token devuelve None si la firma falla, el token caducó o sub no es un número.</text>
</svg>
