<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 652" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Flujo de autenticación con JWT</title>
<desc>Registro: register_user, hash_password y la tabla users, con 409 si el correo existe y 201 sin password_hash. Login: login_user, verify_password y create_access_token, con 401 si el correo o la clave fallan y 200 con el token. Petición protegida: el cliente manda Authorization Bearer, HTTPBearer lo lee y current_user valida; de ahí salen tres 401.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="651" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="40" y="24" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Registro</text>
<rect x="40" y="40" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="130.0" y="58.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">register_user</text>
<text x="130.0" y="78.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">POST /auth/register</text>
<rect x="250" y="40" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="340.0" y="58.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">hash_password</text>
<text x="340.0" y="78.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Argon2, sal incluida</text>
<rect x="460" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="550.0" y="58.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">tabla users</text>
<text x="550.0" y="78.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">guarda password_hash</text>
<line x1="222" y1="68" x2="247" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="432" y1="68" x2="457" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="130" y1="98" x2="130" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="122" width="180" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="130.0" y="139" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">409 · correo repetido</text>
<text x="130.0" y="157" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">comprobación previa</text>
<line x1="550" y1="98" x2="550" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460" y="122" width="180" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="550.0" y="139" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">201 · UserOut</text>
<text x="550.0" y="157" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">sin password_hash</text>
<line x1="40" y1="186" x2="640" y2="186" stroke="#D3D1C7" stroke-width="1"/>
<text x="40" y="208" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Login: se emite el token</text>
<rect x="40" y="224" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="130.0" y="242.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">login_user</text>
<text x="130.0" y="262.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">POST /auth/login</text>
<rect x="250" y="224" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="340.0" y="242.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">verify_password</text>
<text x="340.0" y="262.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Argon2 compara la clave</text>
<rect x="460" y="224" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="550.0" y="242.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">create_access_token</text>
<text x="550.0" y="262.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">firma el JWT (HS256)</text>
<line x1="222" y1="252" x2="247" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="432" y1="252" x2="457" y2="252" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="282" x2="340" y2="304" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="245" y="306" width="190" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="340.0" y="323" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">401 · correo o clave mal</text>
<text x="340.0" y="341" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">mismo mensaje en los dos</text>
<line x1="550" y1="282" x2="550" y2="304" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460" y="306" width="180" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="550.0" y="323" font-size="12" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">200 · Token</text>
<text x="550.0" y="341" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">{access_token, bearer}</text>
<line x1="40" y1="370" x2="640" y2="370" stroke="#D3D1C7" stroke-width="1"/>
<text x="40" y="392" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Cada petición protegida: el cliente reenvía el token</text>
<text x="184" y="418" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Authorization: Bearer &lt;token&gt;</text>
<rect x="41" y="434" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="106.0" y="452.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">cliente</text>
<text x="106.0" y="472.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">envía el token</text>
<rect x="197" y="434" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="262.0" y="452.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">HTTPBearer</text>
<text x="262.0" y="472.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">lee la cabecera</text>
<rect x="353" y="434" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="418.0" y="452.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">current_user</text>
<text x="418.0" y="472.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">valida y busca</text>
<rect x="509" y="434" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="574.0" y="452.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">endpoint</text>
<text x="574.0" y="472.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">recibe el user</text>
<line x1="173" y1="462" x2="194" y2="462" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="329" y1="462" x2="350" y2="462" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="485" y1="462" x2="506" y2="462" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="418" y1="492" x2="418" y2="516" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305" y="518" width="226" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="418.0" y="535" font-size="12" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">401 · sin cabecera</text>
<text x="418.0" y="553" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">401 · firma o exp inválidas</text>
<text x="418.0" y="571" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">401 · el usuario ya no existe</text>
<rect x="40" y="623" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="62" y="630" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Código del backend</text>
<rect x="190" y="623" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="212" y="630" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Cliente o tabla</text>
<rect x="320" y="623" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="342" y="630" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Error 4xx</text>
<rect x="410" y="623" width="14" height="14" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="432" y="630" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Éxito 2xx</text>
</svg>
