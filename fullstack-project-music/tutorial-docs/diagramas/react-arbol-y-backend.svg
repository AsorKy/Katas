<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Árbol de componentes de React y los endpoints que llama cada uno</title>
<desc>main.jsx monta App. App guarda el token y contiene LoginForm, Me y SongList. LoginForm avisa a App con onLogin(token), App entrega token a Me, y cada componente llama a su endpoint de FastAPI: POST /auth/login, GET /me y GET /songs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="499" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="240" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340.0" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">main.jsx</text>
<text x="340.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">monta App en div#root</text>
<line x1="340" y1="88" x2="340" y2="114" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="40" y="116" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="340.0" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">App</text>
<text x="340.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">guarda el token con useState</text>
<line x1="125" y1="230" x2="125" y2="174" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="135" y="203" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">onLogin(token)</text>
<line x1="340" y1="174" x2="340" y2="230" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="350" y="203" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">token={token}</text>
<line x1="555" y1="174" x2="555" y2="230" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="565" y="203" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">sin props</text>
<rect x="40" y="232" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="125.0" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">LoginForm</text>
<text x="125.0" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">pide el token</text>
<rect x="255" y="232" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="340.0" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Me</text>
<text x="340.0" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">usa el token</text>
<rect x="470" y="232" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="555.0" y="250" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">SongList</text>
<text x="555.0" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">lista y búsqueda</text>
<line x1="125" y1="290" x2="125" y2="354" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="135" y="322" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">email + password</text>
<line x1="340" y1="290" x2="340" y2="354" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="350" y="322" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Authorization: Bearer</text>
<line x1="555" y1="290" x2="555" y2="354" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="565" y="322" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">?q=texto</text>
<rect x="36" y="336" width="608" height="112" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/>
<rect x="45" y="356" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="125.0" y="374" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">POST /auth/login</text>
<text x="125.0" y="394" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">devuelve el token</text>
<rect x="260" y="356" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="340.0" y="374" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">GET /me</text>
<text x="340.0" y="394" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">valida el token</text>
<rect x="475" y="356" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="555.0" y="374" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">GET /songs</text>
<text x="555.0" y="394" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">filtra por q</text>
<text x="340" y="432" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Backend FastAPI · localhost:8000</text>
<rect x="40" y="467" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="62" y="474" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">componente de React</text>
<rect x="215" y="467" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="237" y="474" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">backend (FastAPI)</text>
<rect x="377" y="467" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="399" y="474" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">punto de entrada</text>
</svg>
