<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Build multietapa del frontend</title>
  <desc>La etapa 1 usa Node para instalar dependencias y construir la carpeta dist. La etapa 2 parte de nginx y solo copia dist. La etapa 1 se descarta y solo la etapa 2 se publica como imagen final.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="679" height="419" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>

  <text x="340" y="24" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">el build ocurre en la etapa 1; solo dist/ cruza a la etapa 2</text>

  <!-- etapa 1 -->
  <rect x="24" y="44" width="322" height="330" rx="12" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="40" y="62" dominant-baseline="central" font-size="12" fill="#5F5E5A">etapa 1 · FROM node:22-slim AS build</text>

  <rect x="40" y="84" width="290" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="185" y="102" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">COPY package*.json</text>
  <text x="185" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">solo los archivos de dependencias</text>

  <rect x="40" y="156" width="290" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="185" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">RUN npm ci</text>
  <text x="185" y="194" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">node_modules exactos, según el lock</text>

  <rect x="40" y="228" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="185" y="246" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">COPY . .</text>
  <text x="185" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">src/, index.html, vite.config.js</text>

  <rect x="40" y="300" width="290" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="185" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">RUN npm run build</text>
  <text x="185" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">vite build → /app/dist</text>

  <path d="M 185 138 V 154" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 185 210 V 226" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 185 282 V 298" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- etapa 2 -->
  <rect x="420" y="44" width="236" height="330" rx="12" fill="none" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="5 4"/>
  <text x="436" y="62" dominant-baseline="central" font-size="12" fill="#0F6E56">etapa 2 · imagen final</text>

  <rect x="436" y="84" width="204" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="538" y="102" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">FROM nginx:alpine</text>
  <text x="538" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">imagen limpia: sin Node</text>

  <rect x="436" y="156" width="204" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="538" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">COPY --from=build</text>
  <text x="538" y="194" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">/app/dist → html de nginx</text>

  <rect x="436" y="228" width="204" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="538" y="246" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">EXPOSE 80</text>
  <text x="538" y="266" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">solo documenta el puerto</text>

  <rect x="436" y="300" width="204" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="538" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">sin CMD propio</text>
  <text x="538" y="338" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">lo hereda de nginx</text>

  <path d="M 538 138 V 154" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 538 210 V 226" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 538 282 V 298" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- puente entre etapas: dist/ -->
  <path d="M 332 326 H 383 V 182 H 432" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- leyenda -->
  <rect x="24" y="395" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="40" y="400" dominant-baseline="central" font-size="12" fill="#5F5E5A">capa en caché mientras no cambie el lock</text>
  <rect x="320" y="395" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="336" y="400" dominant-baseline="central" font-size="12" fill="#5F5E5A">se descarta</text>
  <rect x="440" y="395" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="456" y="400" dominant-baseline="central" font-size="12" fill="#5F5E5A">se publica</text>
</svg>
