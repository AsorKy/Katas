<circle cx="562" cy="185" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="562" y="185" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">5</text>
<line x1="562" y1="196" x2="562" y2="248" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="602" y1="248" x2="602" y2="196" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="602" cy="185" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="602" y="185" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">6</text>
<line x1="602" y1="174" x2="602" y2="122" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="40" y="250" width="600" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="60" y="278" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">POST /auth/login</text>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Backend FastAPI</text>
<text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">localhost:8000</text>
<text x="620" y="278" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">GET /me</text>
<text x="40" y="334" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Pasos en orden</text>
<circle cx="50" cy="360" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="50" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">1</text>
<text x="68" y="360" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">LoginForm envía email + password</text>
<circle cx="50" cy="384" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="50" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">2</text>
<text x="68" y="384" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">El backend devuelve el access_token</text>
<circle cx="50" cy="408" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="50" y="408" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">3</text>
<text x="68" y="408" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">LoginForm llama onLogin(token) = setToken</text>
<circle cx="360" cy="360" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="360" y="360" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">4</text>
<text x="378" y="360" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">App se redibuja y pasa token a Me</text>
<circle cx="360" cy="384" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="360" y="384" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">5</text>
<text x="378" y="384" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">Me hace GET /me con Bearer token</text>
<circle cx="360" cy="408" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="360" y="408" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">6</text>
<text x="378" y="408" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#2C2C2A">Backend responde; Me pinta el correo</text>
<rect x="40" y="428" width="600" height="36" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="340" y="446" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">Salir = setToken(null): solo se descarta el token en el navegador</text>
