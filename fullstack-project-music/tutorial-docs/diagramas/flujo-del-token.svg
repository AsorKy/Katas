<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 512" width="680" height="512" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Viaje del token: del login al GET /me</title>
<desc>Seis pasos numerados: LoginForm envía email y password a POST /auth/login, el backend devuelve el access_token, LoginForm llama a onLogin(token) que ejecuta setToken en App, App pasa el token por prop a Me, Me llama a GET /me con Authorization Bearer y el backend devuelve el usuario.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="511" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="30" y="28" width="620" height="112" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/>
<text x="44" y="44" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">Navegador (React) · localhost:5173</text>
<rect x="40" y="62" width="116" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="98.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">LoginForm</text>
<text x="98.0" y="100" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">formulario</text>
<rect x="282" y="62" width="116" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="340.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">App</text>
<text x="340.0" y="100" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">guarda token</text>
<rect x="524" y="62" width="116" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="582.0" y="80" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Me</text>
<text x="582.0" y="100" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">perfil</text>
<line x1="158" y1="90" x2="207" y2="90" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="219" cy="90" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="219" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">3</text>
<line x1="231" y1="90" x2="280" y2="90" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="219" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">onLogin(token)</text>
<line x1="400" y1="90" x2="449" y2="90" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="461" cy="90" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="461" y="90" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">4</text>
<line x1="473" y1="90" x2="522" y2="90" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="461" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">token={token}</text>
<line x1="78" y1="120" x2="78" y2="174" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="78" cy="185" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="78" y="185" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">1</text>
<line x1="78" y1="196" x2="78" y2="248" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="118" y1="248" x2="118" y2="196" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="118" cy="185" r="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="118" y="185" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">2</text>
