<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 672" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" dominant-baseline="central" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Ciclo de render y efecto en SongList</title>
<desc>Línea de tiempo de SongList: render 1 con cargando, React pinta, se ejecuta el efecto con fetch, llega la respuesta, se actualiza el estado y render 2 con la lista. A la derecha, notas sobre la limpieza del efecto y StrictMode; abajo, las tres formas de la lista de dependencias de useEffect.</desc>
<style>
.t{font-size:14px;font-weight:500;fill:#2C2C2A}
.s{font-size:12px;fill:#5F5E5A}
.n{font-size:12px;fill:#444441}
.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.ld{stroke:#B4B2A9;stroke-width:1;stroke-dasharray:3 3;fill:none}
.note{fill:#FFFFFF;stroke:#D3D1C7;stroke-width:.8}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.8}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}
.amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.8}.amber .t{fill:#633806}.amber .s{fill:#854F0B}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.8}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}
.red rect{fill:#FCEBEB;stroke:#A32D2D;stroke-width:.8}.red .t{fill:#791F1F}.red .s{fill:#A32D2D}
.green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.8}.green .t{fill:#27500A}.green .s{fill:#3B6D11}
.blue rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:.8}.blue .t{fill:#0C447C}.blue .s{fill:#185FA5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="671" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>

<g text-anchor="middle">
<g class="teal"><rect x="30" y="24" width="320" height="52" rx="8"/><text class="t" x="190" y="41">Render 1</text><text class="s" x="190" y="60">songs = [] · loading = true</text></g>
<g class="teal"><rect x="30" y="106" width="320" height="52" rx="8"/><text class="t" x="190" y="123">Se devuelve «Cargando…»</text><text class="s" x="190" y="142">return &lt;p&gt;Cargando…&lt;/p&gt;</text></g>
<g class="gray"><rect x="30" y="188" width="320" height="52" rx="8"/><text class="t" x="190" y="205">React pinta la pantalla</text><text class="s" x="190" y="224">el usuario ya ve «Cargando…»</text></g>
<g class="amber"><rect x="30" y="270" width="320" height="52" rx="8"/><text class="t" x="190" y="287">Se ejecuta el efecto</text><text class="s" x="190" y="306">load() → fetch con AbortController</text></g>
<g class="amber"><rect x="30" y="352" width="320" height="52" rx="8"/><text class="t" x="190" y="369">Llega la respuesta</text><text class="s" x="190" y="388">setSongs(...) y setLoading(false)</text></g>
<g class="teal"><rect x="30" y="434" width="320" height="52" rx="8"/><text class="t" x="190" y="451">Render 2</text><text class="s" x="190" y="470">los if no se cumplen: devuelve el &lt;ul&gt;</text></g>
</g>

<line class="arr" x1="190" y1="78" x2="190" y2="104" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="160" x2="190" y2="186" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="242" x2="190" y2="268" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="324" x2="190" y2="350" marker-end="url(#arrow)"/>
<line class="arr" x1="190" y1="406" x2="190" y2="432" marker-end="url(#arrow)"/>
<text class="s" x="200" y="91">if (loading)</text>
<text class="s" x="200" y="255">después de pintar</text>
<text class="s" x="200" y="337">la red tarda</text>
<text class="s" x="200" y="419">estado nuevo → render</text>

<line class="ld" x1="352" y1="50" x2="378" y2="50"/>
<line class="ld" x1="352" y1="214" x2="378" y2="214"/>
<line class="ld" x1="352" y1="296" x2="378" y2="296"/>
<line class="ld" x1="352" y1="460" x2="378" y2="460"/>

<rect class="note" x="380" y="24" width="272" height="52" rx="8"/>
<text class="n" x="394" y="41">El efecto queda registrado, pero</text>
<text class="n" x="394" y="59">aún no se ejecuta en este render.</text>

<rect class="note" x="380" y="182" width="272" height="64" rx="8"/>
<text class="n" x="394" y="198">Leer ≠ ejecutar: el código se lee</text>
<text class="n" x="394" y="214">de arriba abajo, pero el efecto</text>
<text class="n" x="394" y="230">corre después de que React pinta.</text>

<rect class="note" x="380" y="268" width="272" height="104" rx="8"/>
<text class="t" x="394" y="286">Limpieza del efecto</text>
<text class="m" x="394" y="306">return () =&gt; controller.abort()</text>
<text class="n" x="394" y="326">React guarda esa función y la</text>
<text class="n" x="394" y="342">ejecuta al desmontar o antes de</text>
<text class="n" x="394" y="358">repetir el efecto.</text>

<rect class="note" x="380" y="384" width="272" height="84" rx="8"/>
<text class="t" x="394" y="402">En desarrollo (StrictMode)</text>
<text class="n" x="394" y="422">monta → desmonta → monta</text>
<text class="n" x="394" y="438">= 2 peticiones; la 1ª se cancela</text>
<text class="n" x="394" y="454">y su AbortError se ignora.</text>

<text class="t" x="30" y="516">Segundo argumento de useEffect: cuándo se repite</text>

<g class="red"><rect x="30" y="532" width="190" height="84" rx="8"/>
<text class="t" x="44" y="550">useEffect(fn)</text>
<text class="s" x="44" y="570">se repite tras cada</text>
<text class="s" x="44" y="586">render: bucle infinito</text>
<text class="s" x="44" y="602">de peticiones</text></g>
<g class="green"><rect x="245" y="532" width="190" height="84" rx="8"/>
<text class="t" x="259" y="550">useEffect(fn, [])</text>
<text class="s" x="259" y="570">una sola vez,</text>
<text class="s" x="259" y="586">al montar el componente</text>
<text class="s" x="259" y="602">(SongList: pide /songs)</text></g>
<g class="blue"><rect x="460" y="532" width="190" height="84" rx="8"/>
<text class="t" x="474" y="550">useEffect(fn, [q])</text>
<text class="s" x="474" y="570">al montar y cada vez</text>
<text class="s" x="474" y="586">que cambia q</text>
<text class="s" x="474" y="602">(la búsqueda)</text></g>

<g>
<rect x="30" y="639" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width=".8"/><text class="s" x="48" y="645">render de SongList</text>
<rect x="190" y="639" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width=".8"/><text class="s" x="208" y="645">efecto (fuera del render)</text>
<rect x="392" y="639" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width=".8"/><text class="s" x="410" y="645">React pinta</text>
</g>
</svg>
