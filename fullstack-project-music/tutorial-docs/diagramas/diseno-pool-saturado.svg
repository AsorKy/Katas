<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Círculo vicioso de la saturación y cómo se corta</title><desc>Una dependencia lenta sube el tiempo por petición; por la ley de Little hay más peticiones en vuelo; el pool de conexiones se llena y las demás esperan; la espera suma latencia y el tiempo sube otra vez. Tres piezas cortan el círculo: timeout corto, rechazo temprano y circuit breaker.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="419" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="20" y="22" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">la saturación se alimenta sola: ejemplo con 800 peticiones por s y un pool de 300</text>
<rect x="20" y="44" width="290" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="165.0" y="67.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">1 · una dependencia se pone lenta</text>
<text x="165.0" y="86.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">el tiempo por petición pasa de 50 ms a 2 s</text>
<rect x="370" y="44" width="290" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="515.0" y="67.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">2 · más peticiones en vuelo</text>
<text x="515.0" y="86.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">L = 800 por s × 2 s = 1.600 peticiones</text>
<rect x="370" y="164" width="290" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="515.0" y="187.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">3 · el pool de 300 se llena</text>
<text x="515.0" y="206.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">1.300 peticiones esperan una conexión</text>
<rect x="20" y="164" width="290" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="165.0" y="187.5" font-size="14" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">4 · la espera suma latencia</text>
<text x="165.0" y="206.5" font-size="12" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">el tiempo vuelve a subir: otra vuelta</text>
<path d="M 312 77.0 H 367" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 515.0 113 V 161" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 368 197.0 H 313" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 165.0 161 V 113" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="137" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">se retroalimenta</text>
<text x="20" y="262" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">tres piezas que lo cortan, cada una en un punto distinto</text>
<rect x="20" y="282" width="196" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="118.0" y="303.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">timeout corto</text>
<text x="118.0" y="322.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">libera la conexión</text>
<text x="118.0" y="341.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">y corta la espera</text>
<rect x="242" y="282" width="196" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="340.0" y="303.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">rechazo temprano</text>
<text x="340.0" y="322.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">503 con cola acotada:</text>
<text x="340.0" y="341.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">un error rápido, no uno lento</text>
<rect x="464" y="282" width="196" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="562.0" y="303.0" font-size="14" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">circuit breaker</text>
<text x="562.0" y="322.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">deja de llamar a la</text>
<text x="562.0" y="341.0" font-size="12" font-weight="400" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">dependencia lenta</text>
<rect x="20" y="384" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="38" y="390" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">el círculo vicioso</text>
<rect x="173.39999999999998" y="384" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="191.39999999999998" y="390" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">cómo se corta</text>
</svg>
