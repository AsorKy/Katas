<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 596" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Preflight de diseño en siete pasos</title><desc>Siete pasos en orden fijo: encuadrar, números, datos y API, piezas y flujos, profundizar, fallos y costo, cerrar. Una flecha de retorno vuelve al paso de números si una cuenta no cierra.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="595" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<text x="20" y="22" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">preflight de diseño: siete pasos, siempre en este orden</text>
<rect x="20" y="46" width="610" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="36" y="71.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start" dominant-baseline="central">0 · encuadrar</text>
<text x="216" y="62.0" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start" dominant-baseline="central">¿qué problema, para quién y qué no voy a hacer?</text>
<text x="216" y="80.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start" dominant-baseline="central">sale: 1 frase, 3 objetivos, 2 no objetivos, límites</text>
<text x="614" y="71.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="end" dominant-baseline="central">3 min</text>
<path d="M 325 99 V 115" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="118" width="610" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="36" y="143.0" font-size="14" font-weight="500" fill="#0C447C" text-anchor="start" dominant-baseline="central">1 · números</text>
<text x="216" y="134.0" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start" dominant-baseline="central">¿qué tan bien y cuánto? un número con unidad</text>
<text x="216" y="152.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="start" dominant-baseline="central">sale: pico, concurrencia, Gbps, TB por día, SLO, p95</text>
<text x="614" y="143.0" font-size="12" font-weight="400" fill="#185FA5" text-anchor="end" dominant-baseline="central">8 min</text>
<path d="M 325 171 V 187" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="190" width="610" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="36" y="215.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="start" dominant-baseline="central">2 · datos y API</text>
<text x="216" y="206.0" font-size="12" font-weight="400" fill="#3C3489" text-anchor="start" dominant-baseline="central">¿quién es dueño de cada dato y qué prometo?</text>
<text x="216" y="224.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">sale: entidades clasificadas, SQL por defecto, rutas</text>
<text x="614" y="215.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="end" dominant-baseline="central">8 min</text>
<path d="M 325 243 V 259" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="262" width="610" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="36" y="287.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="start" dominant-baseline="central">3 · piezas y flujos</text>
<text x="216" y="278.0" font-size="12" font-weight="400" fill="#3C3489" text-anchor="start" dominant-baseline="central">¿qué piezas mínimas y por dónde viajan los bytes?</text>
<text x="216" y="296.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">sale: 2 flujos con plano de control y plano de datos</text>
<text x="614" y="287.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="end" dominant-baseline="central">12 min</text>
<path d="M 325 315 V 331" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="334" width="610" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="36" y="359.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="start" dominant-baseline="central">4 · profundizar</text>
<text x="216" y="350.0" font-size="12" font-weight="400" fill="#3C3489" text-anchor="start" dominant-baseline="central">¿dónde se rompe primero y cuál es la palanca?</text>
<text x="216" y="368.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">sale: el cuello de botella y su palanca</text>
<text x="614" y="359.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="end" dominant-baseline="central">7 min</text>
<path d="M 325 387 V 403" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="406" width="610" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="36" y="431.0" font-size="14" font-weight="500" fill="#633806" text-anchor="start" dominant-baseline="central">5 · fallos y costo</text>
<text x="216" y="422.0" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">¿qué pasa si cae, va lento o abusan? ¿cuánto cuesta?</text>
<text x="216" y="440.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start" dominant-baseline="central">sale: tabla de fallos, 3 amenazas, costo dominante</text>
<text x="614" y="431.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="end" dominant-baseline="central">5 min</text>
<path d="M 325 459 V 475" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="478" width="610" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="36" y="503.0" font-size="14" font-weight="500" fill="#633806" text-anchor="start" dominant-baseline="central">6 · cerrar</text>
<text x="216" y="494.0" font-size="12" font-weight="400" fill="#633806" text-anchor="start" dominant-baseline="central">¿qué decidí, qué pospongo y qué me da más miedo?</text>
<text x="216" y="512.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start" dominant-baseline="central">sale: decisiones, disparadores y el mayor riesgo</text>
<text x="614" y="503.0" font-size="12" font-weight="400" fill="#854F0B" text-anchor="end" dominant-baseline="central">2 min</text>
<path d="M 631 431.0 H 654 V 143.0 H 634" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="20" y="548" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="38" y="554" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">entender y medir</text>
<rect x="160.8" y="548" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="178.8" y="554" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">diseñar</text>
<rect x="244.9" y="548" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="262.9" y="554" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">proteger y cerrar</text>
<text x="20" y="576" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">flecha punteada: si un número no cierra, vuelve al paso 1 · total 45 min</text>
</svg>
