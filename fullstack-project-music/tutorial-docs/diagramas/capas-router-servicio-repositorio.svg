<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 616" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Capas del backend: router, servicio, repositorio y modelos</title>
<desc>Un cliente HTTP llama al router, que usa el servicio para las reglas de negocio, que usa el repositorio para el SQL, que lee y escribe los modelos en SQLite. Las flechas de la izquierda bajan (llama a) y las de la derecha suben (devuelve). Las lecturas simples saltan el servicio y van del router al repositorio.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="615" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>
<rect x="40" y="24" width="404" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="242.0" y="37.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Cliente HTTP</text>
<text x="242.0" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">React, curl o /docs</text>
<rect x="40" y="112" width="404" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="242.0" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Router · routers/songs.py</text>
<text x="242.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">recibe la petición y valida con schemas</text>
<text x="242.0" y="169.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Depends(get_db) y Depends(current_user)</text>
<text x="242.0" y="188.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">traduce errores a HTTPException (401, 404…)</text>
<rect x="40" y="244" width="404" height="92" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="242.0" y="260.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Servicio · services/songs.py</text>
<text x="242.0" y="282.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">reglas: ¿existe el género? ¿y todos los artistas?</text>
<text x="242.0" y="301.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">no importa FastAPI ni sabe de HTTP</text>
<text x="242.0" y="320.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">lanza RelatedNotFound, SongNotFound…</text>
<rect x="40" y="376" width="404" height="92" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="242.0" y="392.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Repositorio · repositories/songs.py</text>
<text x="242.0" y="414.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">SQL con SQLAlchemy: select, db.get, flush, commit</text>
<text x="242.0" y="433.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">devuelve dict, None, bool o set</text>
<text x="242.0" y="452.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">no conoce HTTP ni reglas</text>
<rect x="40" y="508" width="404" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="242.0" y="521.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">Modelos y SQLite · models.py</text>
<text x="242.0" y="543.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">songs, artists, song_artists, genres…</text>
<rect x="474" y="112" width="170" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="559.0" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">schemas.py</text>
<text x="559.0" y="147.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">SongCreate · SongsOut</text>
<rect x="474" y="168" width="170" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="559.0" y="181.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">depends.py, db.py</text>
<text x="559.0" y="203.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">get_db → Session</text>
<line x1="446" y1="136" x2="472" y2="136" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="446" y1="192" x2="472" y2="192" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="100" y1="74" x2="100" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="92.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">POST /songs</text>
<line x1="300" y1="110" x2="300" y2="74" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="310" y="92.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">JSON + código</text>
<line x1="100" y1="206" x2="100" y2="242" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="224.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">create_song(db, body)</text>
<line x1="300" y1="242" x2="300" y2="206" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="310" y="224.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">dict · excepción</text>
<line x1="100" y1="338" x2="100" y2="374" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="356.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">genre_exists(…)</text>
<line x1="300" y1="374" x2="300" y2="338" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="310" y="356.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">bool · set · dict</text>
<line x1="100" y1="470" x2="100" y2="506" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="488.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">SELECT / INSERT</text>
<line x1="300" y1="506" x2="300" y2="470" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="310" y="488.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">filas</text>
<path d="M 430 206 V 224 H 459 V 422 H 448" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="472" y="318" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="500" fill="#2C2C2A">lecturas simples</text>
<text x="472" y="337" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">GET sin reglas de negocio</text>
<text x="472" y="354" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">(router → repositorio)</text>
<rect x="40" y="584" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="58" y="590" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">HTTP</text>
<rect x="110" y="584" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="128" y="590" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">reglas de negocio</text>
<rect x="250" y="584" width="12" height="12" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="268" y="590" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">datos</text>
<text x="320" y="590" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">flecha que baja: llama · flecha que sube: devuelve</text>
</svg>
