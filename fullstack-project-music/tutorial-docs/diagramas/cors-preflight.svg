<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 784" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" dominant-baseline="central" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CORS: preflight y petición real entre React y FastAPI</title>
<desc>Diagrama de secuencia entre el navegador (React en localhost:5173) y la API (FastAPI en localhost:8000). Paso A: el navegador envía OPTIONS /me con Origin y las cabeceras que quiere usar, y CORSMiddleware responde 200 con las cabeceras Access-Control-Allow. Paso B: el navegador envía GET /me con Authorization Bearer y la respuesta lleva Access-Control-Allow-Origin, así que JavaScript puede leerla. Sin esa cabecera el navegador bloquea la lectura aunque la API haya respondido.</desc>
<style>
.t{font-size:14px;font-weight:500;fill:#2C2C2A}
.s{font-size:12px;fill:#5F5E5A}
.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#2C2C2A}
.mb{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.life{stroke:#B4B2A9;stroke-width:1;stroke-dasharray:4 4;fill:none}
.teal rect{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.8}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}
.coral rect{fill:#FAECE7;stroke:#993C1D;stroke-width:.8}.coral .t{fill:#712B13}.coral .s{fill:#993C1D}
.amber rect{fill:#FAEEDA;stroke:#854F0B;stroke-width:.8}.amber .t{fill:#633806}.amber .s{fill:#854F0B}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.8}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}
.blue rect{fill:#E6F1FB;stroke:#185FA5;stroke-width:.8}.blue .t{fill:#0C447C}.blue .m{fill:#0C447C}
.green rect{fill:#EAF3DE;stroke:#3B6D11;stroke-width:.8}.green .t{fill:#27500A}
.band{fill:#F1EFE8}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="783" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>

<rect class="band" x="14" y="88" width="652" height="218" rx="10"/>
<rect class="band" x="14" y="322" width="652" height="218" rx="10"/>

<line class="life" x1="130" y1="74" x2="130" y2="540"/>
<line class="life" x1="550" y1="74" x2="550" y2="540"/>

<g class="teal" text-anchor="middle"><rect x="20" y="20" width="220" height="52" rx="8"/><text class="t" x="130" y="37">Navegador</text><text class="s" x="130" y="56">React · localhost:5173</text></g>
<g class="coral" text-anchor="middle"><rect x="440" y="20" width="220" height="52" rx="8"/><text class="t" x="550" y="37">API</text><text class="s" x="550" y="56">FastAPI · localhost:8000</text></g>

<g text-anchor="middle">
<text class="t" x="340" y="104">A · Preflight (OPTIONS)</text>
<text class="s" x="340" y="122">el navegador pregunta antes de enviar Authorization</text>

<text class="mb" x="340" y="146">OPTIONS /me</text>
<text class="m" x="340" y="162">Origin: http://localhost:5173</text>
<text class="m" x="340" y="178">Access-Control-Request-Method: GET</text>
<text class="m" x="340" y="194">Access-Control-Request-Headers: authorization</text>
<line class="arr" x1="136" y1="208" x2="544" y2="208" marker-end="url(#arrow)"/>

<text class="mb" x="340" y="230">200 OK  (responde CORSMiddleware)</text>
<text class="m" x="340" y="246">Access-Control-Allow-Origin: http://localhost:5173</text>
<text class="m" x="340" y="262">Access-Control-Allow-Methods: DELETE, GET, POST, …</text>
<text class="m" x="340" y="278">Access-Control-Allow-Headers: authorization</text>
<line class="arr" x1="544" y1="292" x2="136" y2="292" marker-end="url(#arrow)"/>

<text class="t" x="340" y="338">B · Petición real</text>
<text class="s" x="340" y="356">ahora sí viaja el token</text>

<text class="mb" x="340" y="380">GET /me</text>
<text class="m" x="340" y="396">Origin: http://localhost:5173</text>
<text class="m" x="340" y="412">Authorization: Bearer eyJ…</text>
<line class="arr" x1="136" y1="426" x2="544" y2="426" marker-end="url(#arrow)"/>

<text class="mb" x="340" y="448">200 OK  {"email": "…"}</text>
<text class="m" x="340" y="464">Access-Control-Allow-Origin: http://localhost:5173</text>
<line class="arr" x1="544" y1="478" x2="136" y2="478" marker-end="url(#arrow)"/>
</g>

<g class="green" text-anchor="middle"><rect x="190" y="494" width="300" height="32" rx="8"/><text class="t" x="340" y="510">React puede leer la respuesta</text></g>

<g class="blue"><rect x="30" y="556" width="620" height="64" rx="8"/>
<text class="t" x="46" y="572">Configuración en backend/app/main.py</text>
<text class="m" x="46" y="590">allow_origins=["http://localhost:5173"]</text>
<text class="m" x="46" y="606">allow_methods=["*"] · allow_headers=["*"]</text></g>

<g class="amber"><rect x="30" y="632" width="620" height="48" rx="8"/>
<text class="t" x="46" y="648">Sin esa cabecera, el navegador no deja a JavaScript leer la respuesta</text>
<text class="s" x="46" y="666">La API sí respondió; React solo ve un error de red.</text></g>

<g class="gray"><rect x="30" y="692" width="620" height="68" rx="8"/>
<text class="t" x="46" y="708">CORS protege al navegador, no a la API</text>
<text class="s" x="46" y="728">curl y Postman no aplican CORS: ven la respuesta aunque falte la cabecera.</text>
<text class="s" x="46" y="744">Origen = protocolo + host + puerto: :5173 y :8000 son orígenes distintos.</text></g>
</svg>
