<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>El ciclo del contrato primero: README, test en rojo, stubs 501, test en verde y lecciones</title>
<desc>El contrato se escribe en el README, se vuelve ejecutable en test_contract.py que empieza en rojo, se construye con schemas y routers que responden 501 hasta ponerlo en verde, y cada lección sustituye el 501 por código real sin tocar el contrato.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.gt{fill:#444441}.gs{fill:#5F5E5A}
.rt{fill:#791F1F}.rs{fill:#A32D2D}
.bt{fill:#0C447C}.bs{fill:#185FA5}
.nt{fill:#27500A}.ns{fill:#3B6D11}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="679" height="539" rx="12" fill="#FBFAF7" stroke="#D3D1C7"/>

<rect x="40" y="30" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th gt" x="200" y="48" text-anchor="middle" dominant-baseline="central">Tabla del contrato (README)</text>
<text class="ts gs" x="200" y="68" text-anchor="middle" dominant-baseline="central">método · auth · cuerpo · éxito · errores</text>

<line x1="200" y1="88" x2="200" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="212" y="106" dominant-baseline="central">se vuelve ejecutable</text>

<rect x="40" y="126" width="320" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text class="th rt" x="200" y="144" text-anchor="middle" dominant-baseline="central">tests/test_contract.py</text>
<text class="ts rs" x="200" y="164" text-anchor="middle" dominant-baseline="central">contrato ejecutable: empieza en rojo</text>

<line x1="200" y1="184" x2="200" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="212" y="202" dominant-baseline="central">faltan rutas → se crean</text>

<rect x="40" y="222" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th bt" x="200" y="240" text-anchor="middle" dominant-baseline="central">schemas.py y routers con stubs</text>
<text class="ts bs" x="200" y="260" text-anchor="middle" dominant-baseline="central">cada ruta responde 501 Not Implemented</text>

<line x1="200" y1="280" x2="200" y2="316" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="212" y="298" dominant-baseline="central">include_router en main.py</text>

<rect x="40" y="318" width="320" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text class="th nt" x="200" y="336" text-anchor="middle" dominant-baseline="central">test_contract.py en verde</text>
<text class="ts ns" x="200" y="356" text-anchor="middle" dominant-baseline="central">las rutas y los códigos existen</text>

<line x1="200" y1="376" x2="200" y2="412" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="212" y="394" dominant-baseline="central">una lección tras otra</text>

<rect x="40" y="414" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th bt" x="200" y="432" text-anchor="middle" dominant-baseline="central">Lecciones siguientes: código real</text>
<text class="ts bs" x="200" y="452" text-anchor="middle" dominant-baseline="central">el contrato no se toca; el test sigue verde</text>

<path d="M360 442 H378 V346 H362" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="400" y="30" width="240" height="56" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="520" y="49" text-anchor="middle" dominant-baseline="central">aquí se decide el diseño:</text>
<text class="ts" x="520" y="67" text-anchor="middle" dominant-baseline="central">nombres, códigos, formas del JSON</text>

<rect x="400" y="126" width="240" height="46" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="520" y="141" text-anchor="middle" dominant-baseline="central">EXPECTED_ROUTES: las 18 rutas</text>
<text class="ts" x="520" y="158" text-anchor="middle" dominant-baseline="central">SUCCESS_CODES: 201, 200, 204</text>

<rect x="400" y="196" width="240" height="112" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="th" x="520" y="214" text-anchor="middle" dominant-baseline="central">dónde se fija cada cosa</text>
<text class="ts" x="520" y="236" text-anchor="middle" dominant-baseline="central">status_code → código de éxito</text>
<text class="ts" x="520" y="254" text-anchor="middle" dominant-baseline="central">response_model → forma del JSON</text>
<text class="ts" x="520" y="272" text-anchor="middle" dominant-baseline="central">schema de entrada → 422 si falla</text>
<text class="ts" x="520" y="290" text-anchor="middle" dominant-baseline="central">raise HTTPException(501) → stub</text>

<rect x="400" y="332" width="240" height="46" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="520" y="347" text-anchor="middle" dominant-baseline="central">FastAPI genera /openapi.json;</text>
<text class="ts" x="520" y="364" text-anchor="middle" dominant-baseline="central">el test lo lee, no ejecuta rutas</text>

<rect x="400" y="418" width="240" height="46" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="520" y="433" text-anchor="middle" dominant-baseline="central">no cambian: decorador y schemas</text>
<text class="ts" x="520" y="450" text-anchor="middle" dominant-baseline="central">cambia: el cuerpo (501 → real)</text>

<rect x="40" y="498" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="ts" x="58" y="504" dominant-baseline="central">especificación</text>
<rect x="170" y="498" width="12" height="12" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text class="ts" x="188" y="504" dominant-baseline="central">test en rojo</text>
<rect x="290" y="498" width="12" height="12" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text class="ts" x="308" y="504" dominant-baseline="central">test en verde</text>
<rect x="420" y="498" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="ts" x="438" y="504" dominant-baseline="central">lo que escribes</text>
</svg>
